<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1/2STOWABLE</title>
  <style>
    :root {
      --bg: #e6e6e6;
      --green: #2e5a3d;
      --red: #c81e1e;
      --card: rgba(255,255,255,0.7);
      --shadow: rgba(0,0,0,0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--green);
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(2rem, 4vw, 4rem);
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--green);
      font-weight: 800;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(46, 90, 61, .12);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 24px var(--shadow);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 30px rgba(0,0,0,.14);
    }

    .card img {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #ddd;
    }

    .meta {
      padding: 12px 14px 14px;
    }

    .name {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--green);
    }

    .sub {
      margin-top: 6px;
      font-size: .72rem;
      color: rgba(46,90,61,.8);
      letter-spacing: .5px;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>1/2STOWABLE</h1>
    <div class="gallery" id="gallery"></div>
  </div>

  <script>
    const items = [
      { name: '毛竹', file: 'images/01_maozhu.jpg' },
      { name: '紫竹', file: 'images/02_zizhu.jpg' },
      { name: '斑竹', file: 'images/03_banzhu.jpg' },
      { name: '慈竹', file: 'images/04_cizhu.jpg' },
      { name: '箭竹', file: 'images/05_jianzhu.jpg' },
      { name: '弱竹', file: 'images/06_ruozhu.jpg' },
      { name: '苦竹', file: 'images/07_kuzhu.jpg' },
      { name: '淡竹', file: 'images/08_danzhu.jpg' },
      { name: '水竹', file: 'images/09_shuizhu.jpg' },
      { name: '钢竹', file: 'images/10_gangzhu.jpg' },
      { name: '桂竹', file: 'images/11_guizhu.jpg' },
      { name: '茶冠竹', file: 'images/12_chaganzhu.jpg' }
    ];

    const gallery = document.getElementById('gallery');

    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';

      const img = document.createElement('img');
      img.src = item.file;
      img.alt = item.name;
      img.onerror = function () {
        this.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400"><rect width="100%" height="100%" fill="#ddd"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#2e5a3d" font-size="26" font-family="Arial">Image missing</text></svg>');
      };

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.innerHTML = `
        <p class="name">${item.name}</p>
        <div class="sub">${item.file}</div>
      `;

      card.appendChild(img);
      card.appendChild(meta);
      gallery.appendChild(card);
    });
  </script>
</body>
</html>
